name: Refresh NL Bucketing Dashboard

on:
  schedule:
    # 06:05 Dubai time every day (Dubai = UTC+4, so 02:05 UTC)
    - cron: '5 2 * * *'
  workflow_dispatch:
    # Also allows one-click manual run from the Actions tab

permissions:
  contents: write      # commit updated HTML back to repo
  pages: write         # publish to GitHub Pages
  id-token: write      # required by actions/deploy-pages

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Pull fresh data from BigQuery and rebuild the HTML
  # ────────────────────────────────────────────────────────────────
  regenerate:
    name: Regenerate dashboard HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0          # full history so git push works cleanly

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Write the service-account JSON from the GitHub Secret.
      # ┌─────────────────────────────────────────────────────────────────┐
      # │  HOW TO ADD THE SECRET                                          │
      # │  1. Go to: repo → Settings → Secrets and variables → Actions   │
      # │  2. Click "New repository secret"                               │
      # │  3. Name:  GCP_SA_KEY                                           │
      # │  4. Value: paste the full contents of your .json key file       │
      # └─────────────────────────────────────────────────────────────────┘
      # Pass the secret as an env var (not inline) so multi-line JSON
      # survives the YAML→shell boundary without corruption.
      # printf '%s' avoids echo adding a trailing newline or mishandling \n.
      - name: Write BigQuery service-account key
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: printf '%s' "$GCP_SA_KEY" > /tmp/gcp_sa_key.json

      # Diagnose the key file — prints size and validity but NEVER blocks the run.
      # If the secret is missing/invalid the regenerate step will fail gracefully
      # and the fallback-copy step ensures Pages still gets updated content.
      - name: Diagnose service-account key
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          path = '/tmp/gcp_sa_key.json'
          size = os.path.getsize(path) if os.path.exists(path) else -1
          print(f"Key file size: {size} bytes")
          if size <= 0:
              print("✗ Key file is empty — GCP_SA_KEY secret is probably not set.")
              print("  Go to: repo → Settings → Secrets → Actions → New repository secret")
              print("  Name: GCP_SA_KEY  |  Value: paste full contents of your .json key file")
          else:
              try:
                  data = json.load(open(path))
                  t = data.get('type','(missing)')
                  proj = data.get('project_id','(missing)')
                  email = data.get('client_email','(missing)')
                  print(f"✓ Valid JSON  |  type={t}  project={proj}")
                  print(f"  client_email: {email}")
              except Exception as e:
                  print(f"✗ JSON parse error: {e}")
                  print("  Secret may have been pasted with extra quotes or wrong format.")
          PYEOF

      # Run regenerate_dashboard.py — allowed to fail so the fallback step runs
      # BQ_PROJECT: optional — auto-detected from service account key if left unset
      # Queries use fully-qualified table paths; no BQ_DATASET needed
      - name: Regenerate dashboard
        id: regen
        continue-on-error: true
        env:
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}   # optional — leave unset to auto-detect from key
        run: |
          python3 regenerate_dashboard.py \
            --template NL_Bucketing_Enhanced_11.template.html \
            --output   Dashboard/NL_Bucketing_Enhanced_11.html \
            --service-account /tmp/gcp_sa_key.json

      # Shred the key immediately regardless of outcome
      - name: Remove service-account key
        if: always()
        run: shred -u /tmp/gcp_sa_key.json 2>/dev/null || rm -f /tmp/gcp_sa_key.json

      # If the script failed OR the output file still doesn't exist,
      # fall back to the template so Pages always has valid content.
      - name: Fallback — copy template if output missing
        run: |
          if [ ! -f "Dashboard/NL_Bucketing_Enhanced_11.html" ]; then
            echo "Output not found — copying template as fallback"
            cp NL_Bucketing_Enhanced_11.template.html Dashboard/NL_Bucketing_Enhanced_11.html
          else
            echo "Output exists ($(wc -c < Dashboard/NL_Bucketing_Enhanced_11.html) bytes) — no fallback needed"
          fi

      # Commit the HTML back to main so the file persists in the repo
      - name: Commit refreshed dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dashboard/NL_Bucketing_Enhanced_11.html
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: auto-refresh dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Package Dashboard/ — file is guaranteed to exist by this point
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: Dashboard/

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Publish the Dashboard folder to GitHub Pages
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: regenerate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
